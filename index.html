<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Funds Tracker</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      margin:20px;
      background:#f7f7f7;
    }

    h2{
      text-align:center;
    }

    .section{
      background:white;
      padding:15px;
      margin-bottom:20px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
    }

    input, button, select{
      margin:5px;
      padding:8px;
      border-radius:5px;
    }

    button{
      background:#2d89ef;
      color:white;
      border:none;
      cursor:pointer;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th, td{
      border:1px solid #ddd;
      padding:10px;
    }

    .unpaid{ background:#ffe5e5; }
    .paid{ background:#e5ffe5; }

    /* LOGIN SCREEN */
    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .loginBox {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      text-align: center;
    }

    .loginBox h2 {
      margin-bottom: 20px;
    }

    .loginBox input {
      width: 200px;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .loginBox button {
      padding: 10px 20px;
      margin-top: 10px;
    }

    #modeIndicator {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      z-index: 999;
    }

    .adminMode {
      background: #28a745;
      color: white;
    }

    .viewerMode {
      background: #ffc107;
      color: black;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>🔐 Team Funds Tracker</h2>
    <p>Enter password to edit, or leave blank to view only</p>
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- MODE INDICATOR -->
<div id="modeIndicator"></div>

<!-- APP CONTENT -->
<div id="appContent" class="hidden">

<h2>Team Funds Tracker</h2>

<div class="section" id="setBalanceSection">
  <h3>Set Starting Balance</h3>
  <input type="number" id="startingTotal" placeholder="Total Funds">
  <input type="number" id="startingCash" placeholder="Cash on Hand">
  <button onclick="setStartingBalance()">Set Balance</button>
</div>

<div class="section" id="addPlayerSection">
  <h3>Add Player</h3>
  <input type="text" id="playerName" placeholder="Player Name">
  <button onclick="addPlayer()">Add</button>
</div>

<div class="section" id="addAbsenceSection">
  <h3>Add Absence</h3>
  <select id="absencePlayer"></select>
  <input type="text" id="absenceDate" placeholder="Date">
  <input type="number" id="absenceAmount" placeholder="Amount (default 100)">
  <button onclick="addAbsence()">Record Absence</button>
</div>

<div class="section" id="recordPaymentSection">
  <h3>Record Payment</h3>
  <select id="paymentPlayer"></select>
  <input type="number" id="paymentAmount" placeholder="Payment Amount">
  <button onclick="recordPayment()">Record Payment</button>
</div>

<div class="section" id="recordExpenseSection">
  <h3>Record Expense</h3>
  <input type="text" id="expenseDesc" placeholder="Expense Description">
  <input type="number" id="expenseAmount" placeholder="Expense Amount">
  <button onclick="recordExpense()">Record Expense</button>
</div>

<div class="section">
  <h3>Player Records</h3>
  <div id="balancesTable"></div>
</div>

<div class="section">
  <h3>Funds Summary</h3>
  <div id="fundsSummary"></div>
  <ul id="expensesList"></ul>
</div>

<div class="section" id="clearDataSection">
  <button onclick="clearAllData()">Clear All Data</button>
  <button onclick="logout()" style="background:#dc3545;">Logout</button>
</div>

</div>

<script type="module">
  // Import Firebase functions
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCDAt6pNu0E6j4LRvlmK-MfVbQ4oZXgNAY",
    authDomain: "project1-64042.firebaseapp.com",
    databaseURL: "https://project1-64042-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "project1-64042",
    storageBucket: "project1-64042.firebasestorage.app",
    messagingSenderId: "92062482630",
    appId: "1:92062482630:web:1d2aa8d3bf4ceb17ca97c7",
    measurementId: "G-64MKD2HZQV"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  let players = [];
  let expenses = [];
  let startingTotal = 0;
  let startingCash = 0;
  let isAdmin = false;

  const ADMIN_PASSWORD = "dentinese84";

  // LOGIN
  window.login = function(){
    const password = document.getElementById("passwordInput").value;
    
    if(password === ADMIN_PASSWORD){
      isAdmin = true;
      showApp();
      updateModeIndicator();
    } else if(password === ""){
      isAdmin = false;
      showApp();
      updateModeIndicator();
    } else {
      alert("Invalid password!");
    }
  }

  // LOGOUT
  window.logout = function(){
    isAdmin = false;
    document.getElementById("passwordInput").value = "";
    document.getElementById("appContent").classList.add("hidden");
    document.getElementById("loginScreen").style.display = "flex";
  }

  // SHOW APP
  function showApp(){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appContent").classList.remove("hidden");
    loadData();
  }

  // UPDATE MODE INDICATOR
  function updateModeIndicator(){
    const indicator = document.getElementById("modeIndicator");
    if(isAdmin){
      indicator.textContent = "✏️ Admin Mode";
      indicator.className = "adminMode";
    } else {
      indicator.textContent = "🔓 Viewer Mode";
      indicator.className = "viewerMode";
    }
  }

  // HIDE/SHOW EDIT SECTIONS
  function updateEditSections(){
    const editSections = [
      "setBalanceSection",
      "addPlayerSection",
      "addAbsenceSection",
      "recordPaymentSection",
      "recordExpenseSection",
      "clearDataSection"
    ];

    editSections.forEach(id => {
      const section = document.getElementById(id);
      if(isAdmin){
        section.classList.remove("hidden");
      } else {
        section.classList.add("hidden");
      }
    });
  }

  // SAVE TO FIREBASE
  async function saveData(){
    try {
      await set(ref(database, 'teamFunds'), {
        players,
        expenses,
        startingTotal,
        startingCash
      });
    } catch (error) {
      console.error("Error saving data:", error);
    }
  }

  // LOAD FROM FIREBASE
  function loadData(){
    const dbRef = ref(database, 'teamFunds');
    onValue(dbRef, (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        players = data.players || [];
        expenses = data.expenses || [];
        startingTotal = data.startingTotal || 0;
        startingCash = data.startingCash || 0;
      } else {
        players = [];
        expenses = [];
        startingTotal = 0;
        startingCash = 0;
      }
      refreshDropdowns();
      updateBalances();
      updateEditSections();
    });
  }

  // DROPDOWNS
  function refreshDropdowns(){
    ["absencePlayer","paymentPlayer"].forEach(id=>{
      let dropdown = document.getElementById(id);
      dropdown.innerHTML = "";

      players.forEach(player=>{
        let option = document.createElement("option");
        option.value = player.name;
        option.textContent = player.name;
        dropdown.appendChild(option);
      });
    });
  }

  // STARTING BALANCE
  window.setStartingBalance = function(){
    if(!isAdmin) return;
    startingTotal = parseFloat(document.getElementById("startingTotal").value) || 0;
    startingCash = parseFloat(document.getElementById("startingCash").value) || 0;
    document.getElementById("startingTotal").value = "";
    document.getElementById("startingCash").value = "";
    saveData();
  }

  // ADD PLAYER
  window.addPlayer = function(){
    if(!isAdmin) return;
    let name = document.getElementById("playerName").value.trim();

    if(!name) return alert("Enter player name.");
    if(players.some(p=>p.name===name)) return alert("Player exists.");

    players.push({ name, owes:0, paid:0, absences:[] });

    document.getElementById("playerName").value = "";

    refreshDropdowns();
    saveData();
  }

  // ADD ABSENCE
  window.addAbsence = function(){
    if(!isAdmin) return;
    let name = document.getElementById("absencePlayer").value;
    let date = document.getElementById("absenceDate").value.trim();
    let amount = parseFloat(document.getElementById("absenceAmount").value) || 100;

    let player = players.find(p=>p.name===name);
    if(!player) return alert("Player not found.");

    player.absences.push({ date:date || "No Date", amount, paidAmount:0 });
    player.owes += amount;

    document.getElementById("absenceDate").value = "";
    document.getElementById("absenceAmount").value = "";

    saveData();
  }

  // PAYMENT
  window.recordPayment = function(){
    if(!isAdmin) return;
    let name = document.getElementById("paymentPlayer").value;
    let amount = parseFloat(document.getElementById("paymentAmount").value);

    if(isNaN(amount) || amount<=0) return alert("Invalid payment.");

    let player = players.find(p=>p.name===name);
    if(!player) return;

    for(let abs of player.absences){
      let remaining = abs.amount - abs.paidAmount;
      if(remaining>0){
        let applied = Math.min(amount, remaining);
        abs.paidAmount += applied;
        player.paid += applied;
        player.owes -= applied;
        amount -= applied;
        if(amount<=0) break;
      }
    }

    document.getElementById("paymentAmount").value = "";
    saveData();
  }

  // EXPENSE
  window.recordExpense = function(){
    if(!isAdmin) return;
    let desc = document.getElementById("expenseDesc").value.trim();
    let amount = parseFloat(document.getElementById("expenseAmount").value);

    if(!desc || isNaN(amount) || amount<=0) return alert("Invalid expense.");

    expenses.push({desc, amount});

    document.getElementById("expenseDesc").value = "";
    document.getElementById("expenseAmount").value = "";

    saveData();
  }

  // DELETE ABSENCE
  window.deleteAbsence = function(playerName, index){
    if(!isAdmin) return;
    let player = players.find(p=>p.name===playerName);
    if(!player) return;

    let abs = player.absences[index];
    player.owes -= (abs.amount - abs.paidAmount);
    player.paid -= abs.paidAmount;

    player.absences.splice(index,1);

    saveData();
  }

  // DELETE EXPENSE
  window.deleteExpense = function(index){
    if(!isAdmin) return;
    expenses.splice(index,1);
    saveData();
  }

  // RESET
  window.clearAllData = function(){
    if(!isAdmin) return;
    if(confirm("Clear all data?")){
      players = [];
      expenses = [];
      startingTotal = 0;
      startingCash = 0;

      saveData();
    }
  }

  // DISPLAY
  function updateBalances(){
    let display = document.getElementById("balancesTable");
    display.innerHTML = "";

    players.forEach(player=>{
      display.innerHTML += `<h3>${player.name}</h3>`;

      if(player.absences.length){
        let table = `<table>
          <tr><th>Date</th><th>Amount</th><th>Status</th><th>Action</th></tr>`;

        player.absences.forEach((abs, idx)=>{
          let status = abs.paidAmount >= abs.amount
            ? "Paid"
            : abs.paidAmount > 0
            ? `Partial (${abs.paidAmount}/${abs.amount})`
            : "Unpaid";

          let rowClass = abs.paidAmount >= abs.amount ? "paid":"unpaid";

          let actionBtn = isAdmin 
            ? `<button onclick="deleteAbsence('${player.name}', ${idx})">Delete</button>`
            : "";

          table += `
            <tr class="${rowClass}">
              <td>${abs.date}</td>
              <td>${abs.amount}</td>
              <td>${status}</td>
              <td>${actionBtn}</td>
            </tr>`;
        });

        table += `</table>`;
        display.innerHTML += table;
      } else {
        display.innerHTML += `<p>No absences recorded.</p>`;
      }
    });

    let totalExpenses = expenses.reduce((s,e)=>s+e.amount,0);
    let totalOwed = players.reduce((s,p)=>s+p.owes,0);
    let totalPaid = players.reduce((s,p)=>s+p.paid,0);

    let cashOnHand = startingCash + totalPaid - totalExpenses;
    let totalFundValue = cashOnHand + totalOwed;

    document.getElementById("fundsSummary").innerHTML = `
      Total Fund: ${totalFundValue}<br>
      Cash: ${cashOnHand}<br>
      Owed: ${totalOwed}<br>
      Expenses: ${totalExpenses}`;

    let list = document.getElementById("expensesList");
    list.innerHTML = "";

    expenses.forEach((e,i)=>{
      let deleteBtn = isAdmin 
        ? `<button onclick="deleteExpense(${i})">Delete</button>`
        : "";
      
      list.innerHTML += `<li>${e.desc} - ${e.amount} ${deleteBtn}</li>`;
    });
  }

</script>

</body>
</html>
